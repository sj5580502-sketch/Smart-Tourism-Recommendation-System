{% extends "base.html" %}{% block title %}Explore{% endblock %}{% block content %}<section class="section"><h1>Search destinations</h1><form class="search"><input name="q" value="{{q}}" placeholder="Dassam, Deoghar, wildlife..."><button class="btn">Search</button></form><div class="grid">{% for p in results %}<article class="card">{% if p.image_url %}<img src="{{p.image_url}}" alt="{{p.name}}">{% endif %}<div class="body"><span>{{p.category.split(',')[0]}}</span><h3>{{p.name}}</h3><p>📍 {{p.city}}</p><a href="/place/{{p.id}}">View details →</a></div></article>{% endfor %}</div></section>{% endblock %}
